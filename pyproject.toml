[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "supportpilot"
version = "4.0.0"
description = "Production-grade multi-tenant e-commerce support platform with workflows, bounded agents and safe actions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SupportPilot contributors" }]
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "langgraph>=0.6,<2",
  "opentelemetry-api>=1.32,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.32,<2",
  "opentelemetry-instrumentation-fastapi>=0.53b0,<1",
  "opentelemetry-sdk>=1.32,<2",
  "prometheus-client>=0.21,<1",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-json-logger>=3.2,<5",
  "redis>=5.2,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "pip-audit>=2.8,<3",
  "pip-tools>=7.5,<8",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 55
show_missing = true

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
