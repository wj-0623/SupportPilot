groups:
  - name: supportpilot-slo
    rules:
      - alert: SupportPilotHighErrorRate
        expr: sum(rate(supportpilot_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(supportpilot_http_requests_total[5m])), 0.001) > 0.02
        for: 10m
        labels: {severity: page}
        annotations: {summary: "SupportPilot API error rate exceeds 2%"}
      - alert: SupportPilotActionFailures
        expr: sum(increase(supportpilot_action_executions_total{status=~"failed|retryable"}[10m])) > 3
        for: 5m
        labels: {severity: page}
        annotations: {summary: "Commerce actions are failing"}
      - alert: SupportPilotP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(supportpilot_http_request_duration_seconds_bucket[5m]))) > 2
        for: 15m
        labels: {severity: ticket}
        annotations: {summary: "SupportPilot p95 latency exceeds two seconds"}
      - alert: SupportPilotOutboundDeadLetters
        expr: sum(increase(supportpilot_outbound_deliveries_total{status="dead_letter"}[10m])) > 0
        for: 1m
        labels: {severity: page}
        annotations: {summary: "Customer-facing messages entered the dead-letter queue"}
